<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slate Multi-Agent Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
          },
        },
      };
    </script>
    <style>
      @layer base {
        :root {
          --background: 0 0% 100%;
          --foreground: 240 10% 3.9%;
          --card: 0 0% 100%;
          --card-foreground: 240 10% 3.9%;
          --popover: 0 0% 100%;
          --popover-foreground: 240 10% 3.9%;
          --primary: 240 5.9% 10%;
          --primary-foreground: 0 0% 98%;
          --secondary: 240 4.8% 95.9%;
          --secondary-foreground: 240 5.9% 10%;
          --muted: 240 4.8% 95.9%;
          --muted-foreground: 240 3.8% 46.1%;
          --accent: 240 4.8% 95.9%;
          --accent-foreground: 240 5.9% 10%;
          --destructive: 0 84.2% 60.2%;
          --destructive-foreground: 0 0% 98%;
          --border: 240 5.9% 90%;
          --input: 240 5.9% 90%;
          --ring: 240 10% 3.9%;
          --radius: 0.5rem;
        }
      }

      /* Markdown Styles */
      .prose h1 {
        font-size: 1.5em;
        font-weight: 700;
        margin-bottom: 0.5em;
      }
      .prose h2 {
        font-size: 1.25em;
        font-weight: 600;
        margin-bottom: 0.5em;
        margin-top: 1em;
      }
      .prose h3 {
        font-size: 1.1em;
        font-weight: 600;
        margin-bottom: 0.5em;
        margin-top: 1em;
      }
      .prose p {
        margin-bottom: 0.8em;
        line-height: 1.6;
      }
      .prose ul {
        list-style-type: disc;
        padding-left: 1.5em;
        margin-bottom: 0.8em;
      }
      .prose ol {
        list-style-type: decimal;
        padding-left: 1.5em;
        margin-bottom: 0.8em;
      }
      .prose strong {
        font-weight: 600;
      }
      .prose code {
        background-color: #f3f4f6;
        padding: 0.2em 0.4em;
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 0.9em;
      }
      .prose pre {
        background-color: #1f2937;
        color: #f3f4f6;
        padding: 1em;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin-bottom: 1em;
      }
      .prose pre code {
        background-color: transparent;
        padding: 0;
        color: inherit;
      }
    </style>
  </head>
  <body
    class="bg-background text-foreground font-sans h-screen flex overflow-hidden"
  >
    <!-- Initial Settings Modal (Blocking) -->
    <div
      id="initial-settings-modal"
      class="fixed inset-0 bg-background z-50 flex items-center justify-center"
    >
      <div
        class="bg-card border border-border rounded-lg shadow-lg p-8 w-full max-w-md space-y-6"
      >
        <div class="text-center space-y-2">
          <h1 class="text-2xl font-bold tracking-tight">
            Welcome to Slate Chat
          </h1>
          <p class="text-muted-foreground">Enter your credentials to begin.</p>
        </div>

        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium">Gemini API Key</label>
            <input
              type="password"
              id="init-gemini-key"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="AIza..."
            />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium">Slate Token</label>
            <input
              type="password"
              id="init-slate-token"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="Token..."
            />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium">Slate Address</label>
            <input
              type="text"
              id="init-slate-address"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="host:port"
            />
          </div>

          <div id="init-error" class="text-sm text-destructive hidden"></div>

          <button
            id="init-connect-btn"
            class="w-full inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
          >
            Connect
          </button>
        </div>
      </div>
    </div>

    <!-- In-App Settings Modal (Hidden by default) -->
    <div
      id="settings-modal"
      class="fixed inset-0 bg-background/80 backdrop-blur-sm z-50 flex items-center justify-center hidden"
    >
      <div
        class="bg-card border border-border rounded-lg shadow-lg p-6 w-full max-w-md"
      >
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Connection Settings</h2>
          <button
            id="close-settings"
            class="text-muted-foreground hover:text-foreground text-xl leading-none"
            title="Close"
          >
            ✕
          </button>
        </div>
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-medium">Gemini API Key</label>
            <input
              type="password"
              id="gemini-key"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="AIza..."
            />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium">Slate Token</label>
            <input
              type="password"
              id="slate-token"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="Token..."
            />
          </div>
          <div class="space-y-2">
            <label class="text-sm font-medium">Slate Address</label>
            <input
              type="text"
              id="slate-address"
              class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
              placeholder="host:port"
            />
          </div>
          <div class="border-t border-border pt-4 mt-4">
            <label class="text-sm font-medium">Slate Memory ID (run_id)</label>
            <p class="text-xs text-muted-foreground mb-2">
              This ID persists your Slate memory across sessions. Clear to start
              fresh.
            </p>
            <div class="flex items-center gap-2">
              <input
                type="text"
                id="run-id-input"
                class="flex h-10 flex-1 rounded-md border border-input bg-background px-3 py-2 text-sm font-mono ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
                placeholder="Auto-generated"
                readonly
              />
              <button
                id="regenerate-run-id"
                class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-10 px-3 py-2"
                title="Generate new Memory ID"
              >
                Reset Memory
              </button>
            </div>
          </div>
          <div class="flex justify-end gap-2 mt-6">
            <button
              id="clear-settings"
              class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-destructive text-destructive-foreground hover:bg-destructive/90 h-10 px-4 py-2"
            >
              Clear All
            </button>
            <button
              id="save-settings"
              class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Left Panel: Chat -->
    <div class="w-1/2 flex flex-col border-r border-border bg-card">
      <div class="p-6 border-b border-border flex items-center justify-between">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Slate Chat</h1>
          <div class="flex items-center gap-2">
            <p class="text-sm text-muted-foreground">Multi-Agent System</p>
            <button
              id="open-settings"
              class="text-xs text-muted-foreground hover:text-foreground"
            >
              ⚙️ Settings
            </button>
          </div>
          <div class="flex flex-col gap-1 text-sm text-muted-foreground mt-1">
            <div class="flex items-center gap-2">
              <span class="w-16">Session:</span>
              <span
                id="session-id-display"
                class="text-xs font-mono text-foreground"
                >-</span
              >
            </div>
            <div class="flex items-center gap-2">
              <span class="w-16">Memory:</span>
              <span
                id="run-id-display"
                class="text-xs font-mono text-foreground"
                >-</span
              >
            </div>
          </div>
        </div>
        <div
          id="status-indicator"
          class="h-2 w-2 rounded-full bg-yellow-500"
          title="Connecting..."
        ></div>
      </div>

      <div id="chat-history" class="flex-1 p-6 overflow-y-auto space-y-4">
        <!-- Messages will appear here -->
        <div class="flex justify-start">
          <div
            class="bg-secondary text-secondary-foreground rounded-lg px-4 py-2 max-w-[85%] text-sm shadow-sm"
          >
            Hello! I am your Slate-powered assistant. Ask me anything.
          </div>
        </div>
      </div>

      <div class="p-4 border-t border-border bg-background">
        <div class="flex gap-2">
          <input
            type="text"
            id="message-input"
            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
            placeholder="Type your message..."
            autocomplete="off"
          />
          <button
            id="send-btn"
            class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2"
          >
            Send
          </button>
        </div>
      </div>
    </div>

    <!-- Right Panel: Agent Internals -->
    <div class="w-1/2 flex flex-col bg-zinc-950 text-zinc-50">
      <div class="p-4 border-b border-zinc-800 bg-zinc-900/50">
        <h2 class="text-sm font-medium flex items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-activity"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          System Activity
        </h2>
      </div>

      <div
        id="logs"
        class="flex-1 p-4 overflow-y-auto font-mono text-xs space-y-3"
      >
        <!-- Logs will appear here -->
      </div>
    </div>

    <script>
      const chatHistory = document.getElementById("chat-history");
      const logs = document.getElementById("logs");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const sessionIdDisplay = document.getElementById("session-id-display");
      const runIdDisplay = document.getElementById("run-id-display");
      const statusIndicator = document.getElementById("status-indicator");

      // Elements
      const initialModal = document.getElementById("initial-settings-modal");
      const initConnectBtn = document.getElementById("init-connect-btn");
      const initError = document.getElementById("init-error");
      const settingsModal = document.getElementById("settings-modal");
      const openSettingsBtn = document.getElementById("open-settings");
      const saveSettingsBtn = document.getElementById("save-settings");
      const clearSettingsBtn = document.getElementById("clear-settings");

      // Inputs
      const initGeminiKey = document.getElementById("init-gemini-key");
      const initSlateToken = document.getElementById("init-slate-token");
      const initSlateAddress = document.getElementById("init-slate-address");
      const geminiKeyInput = document.getElementById("gemini-key");
      const slateTokenInput = document.getElementById("slate-token");
      const slateAddressInput = document.getElementById("slate-address");

      let ws;

      // Generate a unique ID (8-char hex)
      function generateId() {
        return Math.random().toString(16).substring(2, 10);
      }

      // Session ID: regenerated on each page load (chat session)
      let currentSessionId = generateId();

      // Run ID: persistent in localStorage (Slate memory context)
      function getRunId() {
        let runId = localStorage.getItem("slate_run_id");
        if (!runId) {
          runId = generateId();
          localStorage.setItem("slate_run_id", runId);
        }
        return runId;
      }

      function regenerateRunId() {
        const newRunId = generateId();
        localStorage.setItem("slate_run_id", newRunId);
        return newRunId;
      }

      function getStoredCreds() {
        return {
          geminiKey: localStorage.getItem("gemini_api_key"),
          slateToken: localStorage.getItem("slate_token"),
          slateAddress: localStorage.getItem("slate_address"),
          runId: getRunId(),
        };
      }

      function saveCreds(geminiKey, slateToken, slateAddress) {
        localStorage.setItem("gemini_api_key", geminiKey);
        localStorage.setItem("slate_token", slateToken);
        localStorage.setItem("slate_address", slateAddress);

        // Sync inputs
        geminiKeyInput.value = geminiKey;
        slateTokenInput.value = slateToken;
        slateAddressInput.value = slateAddress;
        initGeminiKey.value = geminiKey;
        initSlateToken.value = slateToken;
        initSlateAddress.value = slateAddress;
      }

      function checkCreds() {
        const creds = getStoredCreds();
        if (creds.geminiKey && creds.slateToken && creds.slateAddress) {
          initialModal.classList.add("hidden");
          geminiKeyInput.value = creds.geminiKey;
          slateTokenInput.value = creds.slateToken;
          slateAddressInput.value = creds.slateAddress;
          return true;
        } else {
          initialModal.classList.remove("hidden");
          return false;
        }
      }

      // Initial Flow
      if (checkCreds()) {
        connect();
      }

      // Handle Initial Connect
      if (initConnectBtn) {
        initConnectBtn.addEventListener("click", () => {
          const gKey = initGeminiKey.value.trim();
          const sToken = initSlateToken.value.trim();
          const sAddr = initSlateAddress.value.trim();

          if (!gKey || !sToken || !sAddr) {
            if (initError) {
              initError.textContent = "All fields are required.";
              initError.classList.remove("hidden");
            }
            return;
          }

          saveCreds(gKey, sToken, sAddr);
          if (initialModal) initialModal.classList.add("hidden");
          connect();
        });
      }

      // Settings Modal Logic
      openSettingsBtn.addEventListener("click", () => {
        // Populate run_id input when opening settings
        const runIdInput = document.getElementById("run-id-input");
        if (runIdInput) runIdInput.value = getRunId();
        settingsModal.classList.remove("hidden");
      });

      // Close settings modal
      const closeSettingsBtn = document.getElementById("close-settings");
      if (closeSettingsBtn) {
        closeSettingsBtn.addEventListener("click", () => {
          settingsModal.classList.add("hidden");
        });
      }

      // Regenerate Run ID button
      const regenerateRunIdBtn = document.getElementById("regenerate-run-id");
      if (regenerateRunIdBtn) {
        regenerateRunIdBtn.addEventListener("click", () => {
          const newRunId = regenerateRunId();
          const runIdInput = document.getElementById("run-id-input");
          if (runIdInput) runIdInput.value = newRunId;
          runIdDisplay.textContent = newRunId;
          addLog({
            agent: "System",
            type: "info",
            content: `Memory ID regenerated: ${newRunId}. Reconnect to use new memory.`,
          });
        });
      }

      saveSettingsBtn.addEventListener("click", () => {
        const gKey = geminiKeyInput.value.trim();
        const sToken = slateTokenInput.value.trim();
        const sAddr = slateAddressInput.value.trim();

        if (!gKey || !sToken || !sAddr) {
          alert("All fields are required.");
          return;
        }

        saveCreds(gKey, sToken, sAddr);
        settingsModal.classList.add("hidden");
      });

      clearSettingsBtn.addEventListener("click", () => {
        localStorage.clear();
        location.reload(); // Reload to show initial modal
      });

      function connect() {
        if (ws) {
          ws.close();
        }

        const creds = getStoredCreds();
        if (!creds.geminiKey) return; // Should be handled by modal logic

        // Generate a new session_id for this chat session
        currentSessionId = generateId();

        const wsProtocol =
          window.location.protocol === "https:" ? "wss:" : "ws:";
        let wsUrl = `${wsProtocol}//${window.location.host}/ws`;

        // Append query params
        const params = new URLSearchParams();
        params.append("run_id", creds.runId); // Persistent Slate memory ID
        params.append("session_id", currentSessionId); // New chat session ID
        params.append("gemini_key", creds.geminiKey);
        params.append("slate_token", creds.slateToken);
        params.append("slate_address", creds.slateAddress);

        wsUrl += `?${params.toString()}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusIndicator.className =
            "h-2 w-2 rounded-full bg-green-500 animate-pulse";
          statusIndicator.title = "Connected";
        };

        ws.onclose = (event) => {
          statusIndicator.className = "h-2 w-2 rounded-full bg-red-500";
          statusIndicator.title = "Disconnected";
          if (event.code !== 1000) {
            // Normal closure
            addLog({
              agent: "System",
              type: "error",
              content: "Connection failed. Check settings.",
            });
          }
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);

          if (data.type === "final_response") {
            addMessage("bot", data.content);
          } else if (data.type === "session_info") {
            sessionIdDisplay.textContent = data.session_id;
            runIdDisplay.textContent = data.run_id;
            // Update the settings modal run_id input
            const runIdInput = document.getElementById("run-id-input");
            if (runIdInput) runIdInput.value = data.run_id;
            addLog({
              agent: "System",
              type: "info",
              content: `Chat Session: ${data.session_id} | Memory ID: ${data.run_id}`,
            });
          } else if (data.agent) {
            addLog(data);
          }
        };
      }

      function addMessage(sender, text) {
        const div = document.createElement("div");
        div.className = `flex ${
          sender === "user" ? "justify-end" : "justify-start"
        }`;

        const bubble = document.createElement("div");
        bubble.className =
          sender === "user"
            ? "bg-primary text-primary-foreground rounded-lg px-4 py-2 max-w-[85%] text-sm shadow-sm"
            : "bg-secondary text-secondary-foreground rounded-lg px-4 py-2 max-w-[85%] text-sm shadow-sm prose prose-sm max-w-none";

        if (sender === "bot") {
          bubble.innerHTML = marked.parse(text);
        } else {
          bubble.textContent = text;
        }

        div.appendChild(bubble);
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function addLog(data) {
        const div = document.createElement("div");
        div.className =
          "border-l-2 border-zinc-700 pl-3 py-1 animate-in fade-in slide-in-from-bottom-2 duration-300";

        const time = new Date().toLocaleTimeString([], { hour12: false });

        // Color coding for agents
        let agentColor = "text-blue-400";
        if (data.agent === "Manager") agentColor = "text-purple-400";
        if (data.agent === "Specialist") agentColor = "text-orange-400";
        if (data.agent === "System") agentColor = "text-zinc-500";
        if (data.agent === "Assistant") agentColor = "text-green-400";

        // Latency badge for tool results
        let latencyBadge = "";
        if (data.details && data.details.latency_ms !== undefined) {
          const latency = data.details.latency_ms;
          let latencyColor = "bg-green-900 text-green-300"; // fast < 100ms
          if (latency >= 500) {
            latencyColor = "bg-red-900 text-red-300"; // slow >= 500ms
          } else if (latency >= 100) {
            latencyColor = "bg-yellow-900 text-yellow-300"; // medium 100-500ms
          }
          latencyBadge = `<span class="${latencyColor} text-[10px] px-1.5 py-0.5 rounded font-mono ml-1">${latency.toFixed(
            2
          )}ms</span>`;
        }

        // Tool name badge
        let toolBadge = "";
        if (data.details && data.details.tool) {
          toolBadge = `<span class="bg-zinc-800 text-zinc-300 text-[10px] px-1.5 py-0.5 rounded font-mono ml-1">${data.details.tool}</span>`;
        }

        div.innerHTML = `
            <div class="flex items-center gap-2 mb-1 flex-wrap">
              <span class="text-zinc-500 text-[10px]">${time}</span>
              <span class="font-bold ${agentColor}">${data.agent}</span>
              <span class="text-zinc-400 text-[10px] uppercase tracking-wider bg-zinc-900 px-1 rounded">${
                data.type
              }</span>
              ${toolBadge}${latencyBadge}
            </div>
            <div class="text-zinc-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(
              data.content
            )}</div>
        `;

        logs.appendChild(div);
        const container = logs;
        container.scrollTop = container.scrollHeight;
      }

      function escapeHtml(text) {
        if (!text) return "";
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, function (m) {
          return map[m];
        });
      }

      function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
          addMessage("user", text);
          ws.send(JSON.stringify({ type: "message", content: text }));
          messageInput.value = "";
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
