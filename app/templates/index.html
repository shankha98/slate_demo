<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slate Multi-Agent Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        background-color: #f0f2f5;
      }

      #chat-container {
        width: 50%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #ccc;
        background: white;
      }

      #agent-brain-container {
        width: 50%;
        display: flex;
        flex-direction: column;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 20px;
        overflow-y: auto;
        font-family: "Consolas", "Monaco", "Courier New", monospace;
      }

      #chat-history {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
      }

      .message {
        margin-bottom: 15px;
        max-width: 80%;
        padding: 10px 15px;
        border-radius: 18px;
        line-height: 1.5;
      }

      .message.user {
        background-color: #0084ff;
        color: white;
        align-self: flex-end;
        margin-left: auto;
        border-bottom-right-radius: 4px;
      }

      .message.bot {
        background-color: #e4e6eb;
        color: black;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      #input-area {
        padding: 20px;
        border-top: 1px solid #ddd;
        display: flex;
      }

      #message-input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 20px;
        font-size: 16px;
        outline: none;
      }

      #send-btn {
        background-color: #0084ff;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-left: 10px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      .log-entry {
        margin-bottom: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }

      .log-time {
        color: #888;
        font-size: 0.8em;
      }

      .log-agent {
        color: #569cd6;
        font-weight: bold;
      }

      .log-type {
        color: #c586c0;
        font-style: italic;
      }

      .log-content {
        white-space: pre-wrap;
        margin-top: 5px;
      }

      h2 {
        margin-top: 0;
        border-bottom: 1px solid #555;
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div style="padding: 20px; border-bottom: 1px solid #ddd">
        <h1 style="margin: 0; font-size: 1.2em">Chat Interface</h1>
      </div>
      <div id="chat-history"></div>
      <div id="input-area">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <div id="agent-brain-container">
      <h2>Agent Processes</h2>
      <div id="logs"></div>
    </div>

    <script>
      const chatHistory = document.getElementById("chat-history");
      const logs = document.getElementById("logs");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");

      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "final_response") {
          addMessage("bot", data.content);
        } else if (data.agent) {
          // It's a log event
          addLog(data);
        }
      };

      function addMessage(sender, text) {
        const div = document.createElement("div");
        div.className = `message ${sender}`;
        div.textContent = text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function addLog(data) {
        const div = document.createElement("div");
        div.className = "log-entry";

        const time = new Date().toLocaleTimeString();

        div.innerHTML = `
              <span class="log-time">[${time}]</span>
              <span class="log-agent">${data.agent}</span>
              <span class="log-type">${data.type}</span>
              <div class="log-content">${escapeHtml(data.content)}</div>
          `;

        logs.appendChild(div);
        // Auto scroll to bottom
        const container = document.getElementById("agent-brain-container");
        container.scrollTop = container.scrollHeight;
      }

      function escapeHtml(text) {
        if (!text) return "";
        const map = {
          "&": "&",
          "<": "<",
          ">": ">",
          '"': '"',
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, function (m) {
          return map[m];
        });
      }

      function sendMessage() {
        const text = messageInput.value.trim();
        if (text) {
          addMessage("user", text);
          ws.send(JSON.stringify({ type: "message", content: text }));
          messageInput.value = "";
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
