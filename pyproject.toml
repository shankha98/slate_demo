[project]
name = "slate-demo"
version = "0.1.0"
description = "Multi-agent chat interface powered by Slate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.56.0",
    "python-dotenv>=1.2.1",
    "fastapi>=0.128.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
    "rice-sdk",
]

[tool.uv.sources]
rice-sdk = { git = "https://github.com/shankha98/rice-python-sdk.git" }

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "ty>=0.0.11",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ty]
# Type checker configuration

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
]
