[project]
name = "slate-demo"
version = "0.1.0"
description = "Multi-agent chat interface powered by Slate"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.56.0",
    "python-dotenv>=1.2.1",
    "slate-client",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
]

[tool.uv.sources]
slate-client = { path = "./slate_client/python", editable = true }

[dependency-groups]
dev = ["ruff>=0.14.11", "ty>=0.0.11"]
